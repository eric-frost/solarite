<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex">
  <title>Solarite share image</title>
  <link rel="stylesheet" href="site.css">
  <!-- The source of share.png, the picture shown when a link to the site is posted somewhere.  It is 1200 by 630, and
       everything that matters sits inside the middle 630 by 630, because some sites show a centred square of it.
       Re-take it with agents/artifacts/share-image.ts after changing this file. -->
  <style>
    html, body { width: 1200px; height: 630px; overflow: hidden }
    body { display: grid; place-items: center }
    main { width: 560px; text-align: center; color: #fff }
    .mark { display: inline-flex; align-items: center; gap: 14px; font: 600 50px var(--heading) }
    .mark svg { width: 52px; height: 52px; color: var(--sun) }
    h1 { margin-top: 34px; font-size: 104px; font-weight: 400 }
    h1 span { display: block; font: 600 .35em/1.3 Archivo, var(--heading); letter-spacing: .05em; text-transform: uppercase }
    h1 em { display: block; font: 200 1em/1.05 var(--heading); letter-spacing: -.025em; color: var(--cyan) }
    p { margin-top: 30px; font-size: 25px; color: var(--sky) }
  </style>
</head>
<body class="blueprint">
  <main>
    <div class="mark"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="20" cy="20" r="7" fill="currentColor" stroke="none"/><path d="M20 2v6m0 24v6M2 20h6m24 0h6M7.3 7.3l4.3 4.3m16.8 16.8 4.3 4.3M7.3 32.7l4.3-4.3m16.8-16.8 4.3-4.3"/></svg>Solarite</div>
    <h1><span>No build</span><span>No Signals</span><em>Just Simplicity</em></h1>
    <p>A small library for native web components</p>
  </main>
</body>
</html>
